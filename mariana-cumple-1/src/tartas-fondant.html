<meta charset="utf-8">
<title>Tartas fondant — Mariana</title>
<style>
/*@FONTS@*/
:root{--oro:#C79A3E;--oro-suave:#B08A46;--tinta:#6E5A50;--tinta-2:#8D7A6E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1240px;height:2190px}
body{
  background:
    radial-gradient(110% 60% at 8% -4%, rgba(244,207,213,.42) 0%, rgba(244,207,213,0) 60%),
    radial-gradient(90% 50% at 96% 6%, rgba(200,214,180,.34) 0%, rgba(200,214,180,0) 58%),
    radial-gradient(110% 55% at 4% 96%, rgba(200,214,180,.30) 0%, rgba(200,214,180,0) 60%),
    radial-gradient(90% 50% at 98% 92%, rgba(244,207,213,.34) 0%, rgba(244,207,213,0) 58%),
    linear-gradient(170deg,#FFFCF7 0%,#FDF6F1 50%,#F8F6EF 100%);
  font-family:'Outfit',sans-serif;color:var(--tinta)}

.hoja{position:relative;width:1240px;height:2190px;padding:74px 76px 60px}
.marco{position:absolute;inset:46px;border:1px solid rgba(199,154,62,.34);pointer-events:none}
.marco:after{content:"";position:absolute;inset:10px;border:.7px solid rgba(199,154,62,.18)}

header{text-align:center;margin-bottom:44px}
.kicker{font-family:'Jura',sans-serif;font-weight:500;font-size:14px;letter-spacing:.52em;
  text-indent:.52em;color:var(--oro-suave);text-transform:uppercase}
h1{margin-top:16px;font-family:'Italiana',serif;font-size:78px;line-height:1;letter-spacing:.04em;
  background:linear-gradient(172deg,#E4C486,#C79A3E 45%,#9E7328 72%,#E7CC93);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:12px;font-family:'Nothing',cursive;font-size:34px;color:#8A7264}
.regla{margin:26px auto 0;display:flex;align-items:center;justify-content:center;gap:16px}
.regla i{display:block;width:150px;height:1px;background:linear-gradient(90deg,rgba(199,154,62,0),rgba(199,154,62,.7))}
.regla i:last-child{background:linear-gradient(90deg,rgba(199,154,62,.7),rgba(199,154,62,0))}

.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:46px 44px}
.carta{position:relative;background:linear-gradient(168deg,rgba(255,255,255,.90),rgba(255,255,255,.66));
  border:1px solid rgba(199,154,62,.30);padding:22px 26px 26px;
  box-shadow:0 10px 30px rgba(150,125,105,.07)}
.carta .escena{position:relative;height:322px;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(72% 58% at 50% 42%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%),
    linear-gradient(180deg,rgba(253,248,244,.9),rgba(250,248,242,.55));
  border-bottom:.7px solid rgba(199,154,62,.20)}
.carta h2{margin-top:20px;font-family:'Italiana',serif;font-size:37px;line-height:1.1;
  letter-spacing:.035em;color:#8A6A2F}
.carta .num{position:absolute;top:20px;right:26px;font-family:'Jura',sans-serif;font-weight:500;
  font-size:13px;letter-spacing:.34em;color:var(--oro-suave)}
.carta .lema{margin-top:7px;font-family:'Jura',sans-serif;font-weight:300;font-size:14.5px;
  letter-spacing:.24em;text-transform:uppercase;color:#A2907F}
.muestras{margin-top:16px;display:flex;gap:7px}
.muestras b{display:block;width:26px;height:26px;border-radius:50%;
  box-shadow:inset 0 0 0 .8px rgba(255,255,255,.85), 0 1px 3px rgba(120,105,95,.16)}
dl{margin-top:16px;display:grid;grid-template-columns:104px 1fr;gap:9px 12px}
dt{font-family:'Jura',sans-serif;font-weight:500;font-size:11px;letter-spacing:.20em;
  text-transform:uppercase;color:var(--oro-suave);padding-top:3px}
dd{font-size:15px;line-height:1.42;color:var(--tinta)}
dd em{font-style:normal;color:var(--tinta-2)}
footer{position:absolute;left:76px;right:76px;bottom:64px;text-align:center}
.paleta{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;
  font-family:'Jura',sans-serif;font-weight:300;font-size:12.5px;letter-spacing:.16em;
  color:#9A8C80;text-transform:uppercase}
.paleta span{display:flex;align-items:center;gap:8px}
.paleta u{display:block;width:13px;height:13px;border-radius:50%;text-decoration:none;
  box-shadow:inset 0 0 0 .8px rgba(255,255,255,.9)}
.nota{margin-top:16px;font-family:'Jura',sans-serif;font-weight:300;font-size:12.5px;
  letter-spacing:.26em;text-transform:uppercase;color:#B3A396}
</style>

<div class="hoja">
  <div class="marco"></div>
  <header>
    <div class="kicker">Primer cumpleaños · Mariana · 22 de agosto</div>
    <h1>Tartas de fondant</h1>
    <div class="sub">dos pisos · figuras modeladas</div>
    <div class="regla"><i></i>
      <svg width="15" height="15" viewBox="0 0 18 18"><path d="M9 0 L10.5 7.5 L18 9 L10.5 10.5 L9 18 L7.5 10.5 L0 9 L7.5 7.5 Z" fill="#C79A3E" opacity=".8"/></svg>
      <i></i></div>
  </header>
  <div class="rejilla" id="rejilla"></div>
  <footer>
    <div class="paleta" id="paleta"></div>
    <div class="nota">Fondant liso · figuras en pasta de goma · detalles en oro comestible</div>
  </footer>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
let _s=220826; const rnd=()=>{_s=(_s*1664525+1013904223)%4294967296;return _s/4294967296};
let uid=0;

const C={
  rosa:'#F4CFD5', rosaS:'#E4AFB9', rosaL:'#FCE7EA',
  crema:'#FAF3E8', cremaS:'#EADFCB',
  salvia:'#C8D6B4', salviaS:'#A9BC93',
  oro:'#C79A3E', oroL:'#E9CE8C',
  gris:'#CFCCCB', grisS:'#B2AEAD',
  tan:'#F2CA84', tanS:'#DFAA55', marron:'#A9772F',
  oso:'#E9C89E', osoS:'#D3AB76',
};

function nuevoSvg(){const s=el('svg',{width:'440',height:'322',viewBox:'0 0 440 322'});s.appendChild(el('defs'));return s}
// los dibujos se pintan tanto sobre el <svg> como sobre grupos recortados:
// los <defs> siempre viven en la raíz
const defsDe=(n)=>(n.ownerSVGElement||n).querySelector('defs');
function lg(svg,stops,vert=true){
  const id='g'+(uid++);
  const g=el('linearGradient',{id,x1:'0',y1:'0',x2:vert?'0':'1',y2:vert?'1':'0'});
  stops.forEach(([o,c,op])=>g.appendChild(el('stop',{offset:o,'stop-color':c,'stop-opacity':op===undefined?1:op})));
  defsDe(svg).appendChild(g);return `url(#${id})`;
}
function rgr(svg,stops,cx='34%',cy='28%',r='76%'){
  const id='r'+(uid++);
  const g=el('radialGradient',{id,cx,cy,r});
  stops.forEach(([o,c])=>g.appendChild(el('stop',{offset:o,'stop-color':c})));
  defsDe(svg).appendChild(g);return `url(#${id})`;
}
function recorte(svg,d){
  const id='cp'+(uid++);const cp=el('clipPath',{id});cp.appendChild(el('path',{d}));
  defsDe(svg).appendChild(cp);
  const g=el('g',{'clip-path':`url(#${id})`});svg.appendChild(g);return g;
}
function piso(svg,cx,yTop,yBot,w,relleno,tapa){
  const rx=w/2, ry=w*.062, g=el('g');
  const d=`M${cx-rx} ${yTop} L${cx-rx} ${yBot} A${rx} ${ry} 0 0 0 ${cx+rx} ${yBot} L${cx+rx} ${yTop} Z`;
  g.appendChild(el('path',{d,fill:relleno}));
  g.appendChild(el('path',{d,fill:lg(svg,[[0,'#6E5A50',.15],['16%','#6E5A50',0],['60%','#FFFFFF',.20],['86%','#6E5A50',0],[1,'#6E5A50',.12]],false)}));
  g.appendChild(el('ellipse',{cx,cy:yTop,rx,ry,fill:tapa||relleno}));
  g.appendChild(el('ellipse',{cx,cy:yTop,rx,ry,fill:'none',stroke:'#FFFFFF','stroke-opacity':.5,'stroke-width':.8}));
  svg.appendChild(g);
  return `M${cx-rx} ${yTop} L${cx-rx} ${yBot} A${rx} ${ry} 0 0 0 ${cx+rx} ${yBot} L${cx+rx} ${yTop} A${rx} ${ry} 0 0 0 ${cx-rx} ${yTop} Z`;
}
function bandeja(svg,cx,y,rx,borde){
  svg.appendChild(el('ellipse',{cx,cy:y+15,rx:rx*1.14,ry:rx*.145,fill:'#8D7A6E',opacity:.10}));
  svg.appendChild(el('ellipse',{cx,cy:y+4,rx,ry:rx*.135,fill:borde||C.rosa}));
  svg.appendChild(el('ellipse',{cx,cy:y,rx,ry:rx*.135,fill:lg(svg,[[0,'#FFFFFF'],[1,'#F3EADC']])}));
  svg.appendChild(el('ellipse',{cx,cy:y,rx,ry:rx*.135,fill:'none',stroke:'#FFFFFF','stroke-opacity':.8,'stroke-width':1}));
}

/* ---------- piezas de fondant ---------- */
function esfera(svg,x,y,r,par){
  svg.appendChild(el('circle',{cx:x,cy:y,r,fill:rgr(svg,[[0,par[0]],['58%',par[1]],[1,par[2]||par[1]]])}));
  svg.appendChild(el('ellipse',{cx:x-r*.32,cy:y-r*.34,rx:r*.22,ry:r*.16,fill:'#fff',opacity:.5,
    transform:`rotate(-28 ${x-r*.32} ${y-r*.34})`}));
}
const ESF={
  rosa:['#FCE4E7','#F2C3CB','#E6AEB8'],
  crema:['#FFFDF8','#F3E8D8','#E7D9C3'],
  salvia:['#E1EBD4','#C2D2AC','#AEC095'],
  oro:['#F6E3B4','#D9AE58','#B78C33'],
  blanco:['#FFFFFF','#F6F1EA','#EAE3D9'],
};
function racimo(svg,pts){pts.forEach(([x,y,r,k])=>esfera(svg,x,y,r,ESF[k]))}

function hoja(svg,x,y,l,ang,col,ancho=.42){
  const g=el('g',{transform:`rotate(${ang} ${x} ${y})`});
  g.appendChild(el('path',{d:`M${x} ${y} C${x-l*ancho} ${y-l*.30} ${x-l*ancho} ${y-l*.74} ${x} ${y-l}
    C${x+l*ancho} ${y-l*.74} ${x+l*ancho} ${y-l*.30} ${x} ${y} Z`,fill:col}));
  g.appendChild(el('path',{d:`M${x} ${y} L${x} ${y-l*.92}`,fill:'none',stroke:'#FFFFFF','stroke-opacity':.45,'stroke-width':.8}));
  svg.appendChild(g);
}
function ramita(svg,x,y,l,ang,col){
  const g=el('g',{transform:`rotate(${ang} ${x} ${y})`});
  g.appendChild(el('path',{d:`M${x} ${y} L${x} ${y-l}`,fill:'none',stroke:col,'stroke-width':1}));
  for(let i=1;i<=4;i++){
    const t=i/5, yy=y-l*t, s=l*.20*(1-t*.35);
    [-1,1].forEach(dir=>{
      g.appendChild(el('ellipse',{cx:x+dir*s*.7,cy:yy-s*.2,rx:s*.72,ry:s*.34,fill:col,
        transform:`rotate(${dir*-32} ${x+dir*s*.7} ${yy-s*.2})`}));
    });
  }
  svg.appendChild(g);
}
function monstera(svg,x,y,l,ang,col){
  const g=el('g',{transform:`rotate(${ang} ${x} ${y})`});
  g.appendChild(el('path',{d:`M${x} ${y} C${x-l*.46} ${y-l*.26} ${x-l*.42} ${y-l*.78} ${x} ${y-l}
    C${x+l*.42} ${y-l*.78} ${x+l*.46} ${y-l*.26} ${x} ${y} Z`,fill:col}));
  [.30,.50,.70].forEach(t=>{
    [-1,1].forEach(dir=>{
      g.appendChild(el('path',{d:`M${x+dir*l*.05} ${y-l*t} L${x+dir*l*.40} ${y-l*(t+.06)}`,
        fill:'none',stroke:'#FFFFFF','stroke-opacity':.55,'stroke-width':1.4,'stroke-linecap':'round'}));
    });
  });
  g.appendChild(el('path',{d:`M${x} ${y} L${x} ${y-l*.9}`,fill:'none',stroke:'#FFFFFF','stroke-opacity':.4,'stroke-width':.8}));
  svg.appendChild(g);
}
function flor(svg,x,y,r,col,centro){
  for(let i=0;i<5;i++){
    const a=i*72*Math.PI/180;
    svg.appendChild(el('ellipse',{cx:x+Math.cos(a)*r*.62,cy:y+Math.sin(a)*r*.62,rx:r*.52,ry:r*.44,
      fill:col,transform:`rotate(${i*72} ${x+Math.cos(a)*r*.62} ${y+Math.sin(a)*r*.62})`}));
  }
  svg.appendChild(el('circle',{cx:x,cy:y,r:r*.30,fill:centro||C.oro}));
}
function lazo(svg,x,y,s,col,colS){
  const g=el('g');
  g.appendChild(el('path',{d:`M${x} ${y} C${x-s*1.5} ${y-s*.95} ${x-s*1.9} ${y+s*.55} ${x-s*.18} ${y+s*.16} Z`,fill:col}));
  g.appendChild(el('path',{d:`M${x} ${y} C${x+s*1.5} ${y-s*.95} ${x+s*1.9} ${y+s*.55} ${x+s*.18} ${y+s*.16} Z`,fill:col}));
  g.appendChild(el('path',{d:`M${x-s*.5} ${y+s*.2} C${x-s*.8} ${y+s*1.1} ${x-s*.9} ${y+s*1.5} ${x-s*.55} ${y+s*1.7}
    L${x-s*.15} ${y+s*.35} Z`,fill:colS}));
  g.appendChild(el('path',{d:`M${x+s*.5} ${y+s*.2} C${x+s*.8} ${y+s*1.1} ${x+s*.9} ${y+s*1.5} ${x+s*.55} ${y+s*1.7}
    L${x+s*.15} ${y+s*.35} Z`,fill:colS}));
  g.appendChild(el('ellipse',{cx:x,cy:y+s*.10,rx:s*.34,ry:s*.30,fill:colS}));
  svg.appendChild(g);
}
function corazon(svg,x,y,s,col){
  svg.appendChild(el('path',{d:`M${x} ${y+s*.75} C${x-s*1.3} ${y-s*.25} ${x-s*.55} ${y-s*.95} ${x} ${y-s*.30}
    C${x+s*.55} ${y-s*.95} ${x+s*1.3} ${y-s*.25} ${x} ${y+s*.75} Z`,fill:col}));
}
function perlas(svg,cx,y,rx,n,col,r=2.6){
  for(let i=0;i<=n;i++){const t=i/n,x=cx-rx+t*2*rx,yy=y+Math.sin(Math.PI*t)*rx*.068;
    svg.appendChild(el('circle',{cx:x,cy:yy,r,fill:col}));}
}
function placa(svg,x,y,rx,ry,texto,fuente=34){
  for(let i=0;i<34;i++){
    const a=i/34*Math.PI*2;
    svg.appendChild(el('circle',{cx:x+Math.cos(a)*rx,cy:y+Math.sin(a)*ry,r:2.6,fill:C.rosa}));
  }
  svg.appendChild(el('ellipse',{cx:x,cy:y,rx,ry,fill:lg(svg,[[0,'#FFFDF9'],[1,'#F5EBDC']])}));
  svg.appendChild(el('ellipse',{cx:x,cy:y,rx:rx-3,ry:ry-3,fill:'none',stroke:C.oro,'stroke-opacity':.45,'stroke-width':.8}));
  const t=el('text',{x,y:y+fuente*.30,'text-anchor':'middle','font-family':'Nothing','font-size':fuente,
    fill:lg(svg,[[0,'#E4C486'],['48%','#C79A3E'],[1,'#9E7328']])});
  t.textContent=texto; svg.appendChild(t);
}
function uno(svg,x,yB,h,relleno,borde){
  const w=h*.30;
  const d=`M${x-w*.95} ${yB-h*.70} L${x+w*.10} ${yB-h} L${x+w*.62} ${yB-h} L${x+w*.62} ${yB}
    L${x-w*.28} ${yB} L${x-w*.28} ${yB-h*.66} L${x-w*.62} ${yB-h*.54} Z`;
  svg.appendChild(el('path',{d,fill:relleno,stroke:borde,'stroke-width':1.6,
    'stroke-linejoin':'round','stroke-linecap':'round'}));
  for(let i=0;i<9;i++){
    svg.appendChild(el('circle',{cx:x+(rnd()-.55)*w*.8,cy:yB-h*.08-rnd()*h*.66,r:.9,fill:C.oro,opacity:.75}));
  }
}
function banderines(svg,x0,x1,y,comba,cols){
  const d=`M${x0} ${y} Q${(x0+x1)/2} ${y+comba} ${x1} ${y}`;
  const p=el('path',{d,fill:'none',stroke:'#FFFFFF','stroke-opacity':.85,'stroke-width':1.4});
  svg.appendChild(p);
  const L=p.getTotalLength(), n=9;
  for(let i=0;i<n;i++){
    const q=p.getPointAtLength(L*(i+.5)/n), s=8.5;
    svg.appendChild(el('path',{d:`M${q.x-s*.52} ${q.y} L${q.x+s*.52} ${q.y} L${q.x} ${q.y+s*1.25} Z`,
      fill:cols[i%cols.length]}));
  }
}
function palmera(svg,x,yB,h,colT,colH){
  svg.appendChild(el('path',{d:`M${x-3} ${yB} C${x-2} ${yB-h*.5} ${x-1} ${yB-h*.8} ${x+2} ${yB-h}
    L${x+6} ${yB-h*.98} C${x+3} ${yB-h*.78} ${x+2} ${yB-h*.5} ${x+2} ${yB} Z`,fill:colT}));
  for(let i=1;i<6;i++){
    const yy=yB-h*.14*i;
    svg.appendChild(el('path',{d:`M${x-2.5} ${yy} L${x+3.5} ${yy-1.2}`,fill:'none',
      stroke:'#FFFFFF','stroke-opacity':.5,'stroke-width':.9}));
  }
  const cop=[[-38,26],[-18,14],[0,8],[18,16],[38,30],[-56,44],[56,46]];
  cop.forEach(([ang,l])=>{
    const g=el('g',{transform:`rotate(${ang} ${x+3} ${yB-h}) `});
    g.appendChild(el('path',{d:`M${x+3} ${yB-h} C${x-l*.42} ${yB-h-l*.5} ${x-l*.30} ${yB-h-l*1.02} ${x+3} ${yB-h-l*1.1}
      C${x+l*.36} ${yB-h-l*1.0} ${x+l*.48} ${yB-h-l*.5} ${x+3} ${yB-h} Z`,fill:colH}));
    g.appendChild(el('path',{d:`M${x+3} ${yB-h} L${x+3} ${yB-h-l*1.04}`,fill:'none',stroke:'#FFFFFF','stroke-opacity':.45,'stroke-width':.8}));
    svg.appendChild(g);
  });
}

/* ---------- figuras modeladas ---------- */
function ojo(svg,x,y,r){
  svg.appendChild(el('ellipse',{cx:x,cy:y,rx:r,ry:r*1.15,fill:'#463228'}));
  svg.appendChild(el('circle',{cx:x-r*.28,cy:y-r*.34,r:r*.34,fill:'#fff',opacity:.9}));
}
function lacito(svg,x,y,s){lazo(svg,x,y,s,C.rosa,C.rosaS)}

function jirafa(svg,x,yB,s){
  const cuerpo=rgr(svg,[[0,'#FBE2B4'],['55%',C.tan],[1,C.tanS]]);
  // patas traseras
  [[-11,0],[11,0]].forEach(([dx])=>{
    svg.appendChild(el('ellipse',{cx:x+dx*s,cy:yB-2.6*s,rx:5.2*s,ry:2.8*s,fill:cuerpo}));
    svg.appendChild(el('ellipse',{cx:x+dx*1.34*s,cy:yB-2.4*s,rx:2.1*s,ry:2.1*s,fill:C.marron}));
  });
  // cuerpo
  svg.appendChild(el('ellipse',{cx:x,cy:yB-9.5*s,rx:9.6*s,ry:8.6*s,fill:cuerpo}));
  // patas delanteras
  [[-4.6],[4.6]].forEach(([dx])=>{
    svg.appendChild(el('rect',{x:x+dx*s-2.2*s,y:yB-8*s,width:4.4*s,height:7*s,rx:2.2*s,fill:cuerpo}));
    svg.appendChild(el('ellipse',{cx:x+dx*s,cy:yB-1.6*s,rx:2.4*s,ry:1.8*s,fill:C.marron}));
  });
  // manchas
  [[-4.5,-12,2.0],[3.6,-13.4,1.7],[-1.2,-7.6,1.9],[5.4,-8.2,1.6],[-6.2,-6.6,1.4]]
    .forEach(([dx,dy,r])=>svg.appendChild(el('ellipse',{cx:x+dx*s,cy:yB+dy*s,rx:r*s,ry:r*.86*s,fill:C.marron,opacity:.55})));
  // cuello
  svg.appendChild(el('rect',{x:x-3.4*s,y:yB-30*s,width:6.8*s,height:15*s,rx:3.2*s,fill:cuerpo}));
  [[0,-18,1.5],[0,-23,1.4],[0,-27.5,1.2]].forEach(([dx,dy,r])=>
    svg.appendChild(el('ellipse',{cx:x+dx*s-1.2*s,cy:yB+dy*s,rx:r*s,ry:r*.8*s,fill:C.marron,opacity:.5})));
  // orejas
  [[-7.6,-32,-30],[7.6,-32,30]].forEach(([dx,dy,rot])=>
    svg.appendChild(el('ellipse',{cx:x+dx*s,cy:yB+dy*s,rx:3.1*s,ry:1.7*s,fill:C.tanS,
      transform:`rotate(${rot} ${x+dx*s} ${yB+dy*s})`})));
  // cuernos
  [[-2.4],[2.4]].forEach(([dx])=>{
    svg.appendChild(el('rect',{x:x+dx*s-.55*s,y:yB-39*s,width:1.1*s,height:4.4*s,rx:.5*s,fill:C.marron}));
    svg.appendChild(el('circle',{cx:x+dx*s,cy:yB-39.2*s,r:1.35*s,fill:C.marron}));
  });
  // cabeza
  svg.appendChild(el('ellipse',{cx:x,cy:yB-33*s,rx:7.2*s,ry:6.1*s,fill:cuerpo}));
  svg.appendChild(el('ellipse',{cx:x,cy:yB-30.4*s,rx:4.7*s,ry:3.5*s,fill:'#FFF8EC'}));
  [[-1.5],[1.5]].forEach(([dx])=>svg.appendChild(el('ellipse',{cx:x+dx*s,cy:yB-31*s,rx:.45*s,ry:.32*s,fill:'#B08A5A'})));

function osito(svg,x,yB,s){
  const piel=rgr(svg,[[0,'#F7DFC0'],['55%',C.oso],[1,C.osoS]]);
  [[-5.4],[5.4]].forEach(([dx])=>svg.appendChild(el('ellipse',{cx:x+dx*s,cy:yB-2.4*s,rx:3.9*s,ry:2.6*s,fill:piel})));
  // vestido
  svg.appendChild(el('path',{d:`M${x-6.6*s} ${yB-3.4*s} L${x-4.6*s} ${yB-13*s} L${x+4.6*s} ${yB-13*s}
    L${x+6.6*s} ${yB-3.4*s} Z`,fill:lg(svg,[[0,'#FBE1E5'],[1,C.rosa]])}));
  svg.appendChild(el('path',{d:`M${x-6.6*s} ${yB-3.4*s} Q${x} ${yB-1.6*s} ${x+6.6*s} ${yB-3.4*s}
    Q${x} ${yB-5.4*s} ${x-6.6*s} ${yB-3.4*s} Z`,fill:C.rosaS,opacity:.6}));
  // brazos
  [[-6.8,-22],[6.8,22]].forEach(([dx,rot])=>
    svg.appendChild(el('ellipse',{cx:x+dx*s,cy:yB-10.4*s,rx:2.3*s,ry:3.6*s,fill:piel,
      transform:`rotate(${rot} ${x+dx*s} ${yB-10.4*s})`})));
  // orejas + cabeza
  [[-5.6],[5.6]].forEach(([dx])=>{
    svg.appendChild(el('circle',{cx:x+dx*s,cy:yB-21.6*s,r:2.9*s,fill:piel}));
    svg.appendChild(el('circle',{cx:x+dx*s,cy:yB-21.6*s,r:1.5*s,fill:C.rosaL}));
  });
  svg.appendChild(el('circle',{cx:x,cy:yB-18.2*s,r:6.6*s,fill:piel}));
  svg.appendChild(el('ellipse',{cx:x,cy:yB-16.2*s,rx:4*s,ry:3.1*s,fill:'#FBEEDC'}));
  svg.appendChild(el('path',{d:`M${x} ${yB-17.6*s} L${x-1.3*s} ${yB-18.6*s} L${x+1.3*s} ${yB-18.6*s} Z`,fill:'#6B4A33'}));
  svg.appendChild(el('path',{d:`M${x} ${yB-17.6*s} L${x} ${yB-16.2*s}`,fill:'none',stroke:'#6B4A33','stroke-width':.7*s}));
  ojo(svg,x-2.6*s,yB-19.8*s,1.05*s); ojo(svg,x+2.6*s,yB-19.8*s,1.05*s);
  lacito(svg,x-5.6*s,yB-24.4*s,2.1*s);
}

function globoHilo(svg,x,yB,alto,r,par){
  svg.appendChild(el('path',{d:`M${x} ${yB} L${x} ${yB-alto+r}`,fill:'none',stroke:C.oro,'stroke-width':1,'stroke-opacity':.75}));
  svg.appendChild(el('ellipse',{cx:x,cy:yB-alto,rx:r,ry:r*1.14,fill:rgr(svg,[[0,par[0]],['58%',par[1]],[1,par[2]||par[1]]])}));
  svg.appendChild(el('path',{d:`M${x-r*.13} ${yB-alto+r*1.12} L${x+r*.13} ${yB-alto+r*1.12} L${x} ${yB-alto+r*1.36} Z`,fill:par[2]||par[1]}));
  svg.appendChild(el('ellipse',{cx:x-r*.32,cy:yB-alto-r*.36,rx:r*.20,ry:r*.28,fill:'#fff',opacity:.55,
    transform:`rotate(-24 ${x-r*.32} ${yB-alto-r*.36})`}));
}

/* D · corona de flores */
function tartaD(){
  const s=nuevoSvg(), cx=220;

  const nm=el('text',{x:cx,y:252,'text-anchor':'middle','font-family':'Nothing','font-size':38,
    fill:lg(s,[[0,'#E4C486'],['48%','#C79A3E'],[1,'#9E7328']])});

  ramita(capa,cx-84,268,26,16,C.salvia);

  lazo(s,cx,194,10,'#FBE1E5',C.rosaS);
  const dSup=piso(s,cx,96,188,150,lg(s,[[0,'#FFFDF8'],['55%',C.crema],[1,'#F0E6D6']]),'#FFFDF8');
  const capaS=recorte(s,dSup);
  // corona de flores alrededor del 1
  const R=34, cyW=142;
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2 - Math.PI/2;

    if(i%3===0) flor(capaS,x,y,4.6,'#FBE1E5',C.oro);
    else hoja(capaS,x,y+5,11,(a*180/Math.PI)+96,i%2?C.salvia:C.salviaS);
  }
  uno(capaS,cx+2,162,40,'none',C.oro);
  for(let i=0;i<12;i++) capaS.appendChild(el('circle',{cx:cx-64+rnd()*128,cy:106+rnd()*70,r:1.2,fill:C.oro,opacity:.5}));
  globoHilo(s,cx+30,96,76,11,ESF.rosa);
  perlas(s,cx,294,112,26,'#FFFFFF',2.8);
  return s;
}
